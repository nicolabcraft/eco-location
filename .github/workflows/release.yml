# Publie une release a chaque tag de version : git tag v1.2.0 && git push origin v1.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verifications
        run: |
          dotnet build -c Release
          node tools/check-vehicles.mjs
          node tools/eco-translations.mjs check translations/Location.csv usercode/Location

      - name: Paquet
        run: node tools/package.mjs "${GITHUB_REF_NAME#v}"

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --title "Location ${GITHUB_REF_NAME#v}" \
            --notes "Voir [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md). See the changelog for details."
