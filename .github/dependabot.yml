# Mises a jour automatiques des dependances (Dependabot).
# Eco.ReferenceAssemblies est exclu : sa version doit rester celle du serveur
# Eco cible, on la change a la main a chaque version d'Eco.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      - dependency-name: Eco.ReferenceAssemblies
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    labels: [dependencies]
